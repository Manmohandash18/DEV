<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>University Registration Form</h1>

    <p>Please fill out the form below to register</p>
    <hr>
   <form> 

    <h2>Personal Details</h2>
    <br>

    <label for="name">First Nmae:</label>
    <input type="text" name="userName" id="name" placeholder="e.g: Arjun" required><br><br>

    <label for="name1">Last Nmae:</label>
    <input type="text" name="username" id="name1" placeholder="e.g: Das" required><br><br>

    <label for="dob">DOB:</label>
    <input type="date" name="Birth" id="dob"><br>

    <h3>Gender</h3>

    <label for="male">Male</label>
    <input type="radio" name="gender" id="male" value="male">
    <br>
    <label for="female">Female</label>
    <input type="radio" name="gender" id="female" value="female">
    <br>
    <label for="other">Other</label>
    <input type="radio" name="gender" id="other" value="other">
    <br><br>
    <h3>Upload your photo:</h3>

    <input type="file" name="file">

    <hr>

    <h2>Contact Information</h2>

    <label for="email">mail Address</label>
    <input type="email" name="mail" id="email" placeholder="ypu@gmail.com"><br><br>
    
    <label for="phone">Phone number:</label>
    <input type="tel" name="phone" id="phone" placeholder="e.g:8418484951"> <br><br>

    <label for="address">Mailing address</label><br>
    <textarea name="address" id="address" placeholder="CGINGUDIKHOLA,GANJAM,ODISHA"></textarea>
    <hr>

    <h2>Academic information</h2>
    <label for="course">select your course:</label>
    <br> 
    <select name="course" id="course">
        <option value="CSE">CSE</option>
        <option value="ME">ME</option>
        <option value="CE">CE</option>
    </select>

    <h3>Extra Curricular Activity</h3>
    <label for="sports">Sports</label>
    <input type="checkbox" name="hobby" id="sports" value="sports">
    <br>
    <label for="music">Music</label>
    <input type="checkbox" name="hobby" id="music" value="music"><br>

    <label for="tech">Technology</label>
    <input type="checkbox" name="hobby" id="tech" value="Technology"><br>
    <label for="volunt">Voluntering</label>
    <input type="checkbox" name="hobby" id="volunt" value="Voluntering"><br>
    <hr>

    <h2>Create your Account</h2>
    <label for="pass">Create your password:</label>
    <input type="password" name="password" id="pass"><br>
    <label for="sec">Security Question:</label>
    <select name="Security" id="sec">
        <option value="pet">What was your first pets name?</option>
        <option value="color">What is your favorite color?</option>
        <option value="nick">What is your nicname?</option>
    </select>
    <br>
    <label for="ans">Security answer:</label>
    <input type="text" name="secans" id="ans"><br>

    <hr>
    <button type="submit">Register</button>
    <button type="reset">Reset</button>
    </form>

</body>
</html>
